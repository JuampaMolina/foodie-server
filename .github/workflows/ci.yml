name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check-syntax

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
