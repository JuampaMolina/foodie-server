# Blueprint de Render (https://render.com/docs/blueprint-spec). Al conectar
# este repo en Render y elegir "New Blueprint Instance", detecta este
# fichero y crea el servicio con esta configuración sin más pasos manuales.
#
# MONGO_URI y JWT_SECRET no están aquí a propósito (son secretos): hay que
# rellenarlos a mano en el panel de Render tras crear el servicio, en
# Environment > Environment Variables. MONGO_URI debe apuntar a un cluster
# de MongoDB Atlas (Render no ofrece Mongo gestionado).
services:
  - type: web
    name: foodie-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
